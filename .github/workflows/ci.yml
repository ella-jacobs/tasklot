# CI for TaskLot: the same checks as the README's Tests section, on every push and PR.
#
#   test      `make test`: firmware host tests, Python unittest, node --test. pyserial
#             is installed, so the ears end-to-end test runs instead of being skipped.
#             Python 3.9 (the oldest the README promises) and 3.13 on Linux, plus macOS,
#             where the project was developed.
#   firmware  every sketch compiled for the Mega 2560 with arduino-cli, and the sketch
#             again with each REMEMBER / USE_PRESENCE switch flipped.
#
# Third-party actions are pinned to commit SHAs (the release tag is in the comment), and
# the AVR core, libraries and arduino-cli are pinned to the versions the firmware README
# lists.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: make test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-14, python: "3.13" }
    env:
      # The firmware host tests build with -Werror; use clang everywhere, as on the
      # macOS machine they were written on, rather than whichever c++ the runner has.
      CXX: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Install pyserial (pinned in tools/voice/requirements.txt)
        run: python3 -m pip install -r tools/voice/requirements.txt
      - name: Run every automated check
        run: make test

  firmware:
    name: compile for the Mega 2560
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02  # v2.0.0
        with:
          version: "1.5.1"
      - name: Install the AVR core and the two libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install "MFRC522@1.4.12" "LiquidCrystal I2C@1.1.2"
      - name: Compile the v2 sketch and every history sketch
        run: make firmware
      - name: Compile the v2 sketch with each feature switch
        run: make -C firmware compile
